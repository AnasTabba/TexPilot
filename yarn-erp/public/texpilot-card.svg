<text x="20" y="20" font-size="4.6" font-weight="bold">TexPilot card: print at 100% (actual size, not &quot;fit to page&quot;)</text>
<text x="33" y="247" font-size="3">0</text>
<text x="128" y="247" font-size="3">100 mm</text>
<text x="20" y="28" font-size="3.6">Each black square must measure 30 mm: check the ruler below (100 mm).</text>
<text x="20" y="34" font-size="3.6">Cut out one card along the dashed line and lay it flat on the fabric.</text>
<text x="20" y="40" font-size="3.6">Use the normal (1x) camera, straight above, about 15 cm away, selvedge running up</text>
<text x="20" y="46" font-size="3.6">the screen. Keep the card off the photo's edges; fill the rest with fabric.</text>
