[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "texpilot"
version = "0.1.0"
description = "Fabric verification scanner and garment production planning platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Heavy. Only needed to train or run the vision model: `make setup-ml`
ml = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "albumentations>=2.0",
    "opencv-python-headless>=4.9",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "pillow>=10.4",
]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "httpx>=0.27"]

# app/ is a React Native workspace, not a Python package -- exclude it from
# discovery or setuptools refuses to build.
[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's File()/Form()/Depends() defaults are the framework's
# documented signature style, not the mutable-default bug B008 targets.
ignore = ["B008"]
